name: Nightly Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Build autobrowser.js
        run: bun run build:cli

      - name: Build browser extension
        run: bun run build:chrome

      - name: Package browser extension
        run: cd chrome && zip -r ../autobrowser-extension.zip .

      - name: Prepare release metadata
        id: meta
        run: |
          date=$(date -u +'%Y%m%d')
          short_sha=${GITHUB_SHA::7}
          echo "tag=nightly-${date}-${short_sha}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "name=Nightly ${date} (${short_sha})" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          body: |
            Nightly build for commit `${{ github.sha }}`.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            dist/autobrowser.js
            autobrowser-extension.zip

      - name: Upload autobrowser.js
        uses: actions/upload-artifact@v4
        with:
          name: autobrowser-js
          path: dist/autobrowser.js
          if-no-files-found: error

      - name: Upload browser extension zip
        uses: actions/upload-artifact@v4
        with:
          name: autobrowser-extension-zip
          path: autobrowser-extension.zip
          if-no-files-found: error
