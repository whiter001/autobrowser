name: Nightly Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Build autobrowser.js
        run: bun run build:cli

      - name: Build browser extension
        run: bun run build:chrome

      - name: Package browser extension
        run: cd chrome && zip -r ../autobrowser-extension.zip .

      - name: Upload autobrowser.js
        uses: actions/upload-artifact@v4
        with:
          name: autobrowser-js
          path: dist/autobrowser.js
          if-no-files-found: error

      - name: Upload browser extension zip
        uses: actions/upload-artifact@v4
        with:
          name: autobrowser-extension-zip
          path: autobrowser-extension.zip
          if-no-files-found: error
